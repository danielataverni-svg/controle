<style>
:root{--bg:#fbf3e4;--card:#f1eadb;--tx:#151515;--mut:#7a7466;--ac:#151515;--pos:#2e7d4f;--red:#c9423b;--yel:#d9a21b;--bd:#e0d6bf;--y:#f7dc5b;--p:#f5b5d3;--g:#a9b96e;--bl:#b9c9ee;--wh:rgba(255,255,255,.6)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "DM Sans","Helvetica Neue",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:18px}
.shell{max-width:1180px;margin:0 auto;border:2px solid #3b3b3b;border-radius:28px;padding:14px;display:flex;gap:18px;align-items:flex-start}
.side{width:190px;flex:none;background:#121212;color:#fff;border-radius:22px;padding:22px 12px;position:sticky;top:18px;min-height:560px}
.logo{font-size:26px;font-weight:800;letter-spacing:-1px;padding:0 10px 18px}.logo i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--p);margin-left:3px}
.side .lbl{font-size:11px;color:#8d8d8d;padding:0 10px 6px}
nav{display:flex;flex-direction:column;gap:3px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:#cfcfcf;padding:10px 12px;border-radius:12px;font:inherit;font-size:14px;cursor:pointer;text-align:left}
nav button.on{background:#2b2b2b;color:#fff;font-weight:600}
main{flex:1;min-width:0;padding:4px 4px 30px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:34px;line-height:1.1;letter-spacing:-1.2px;font-weight:800;margin:6px 0 4px}.sub{color:var(--mut);font-size:14px;max-width:520px}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.3px}
#mes{border-radius:999px;background:var(--p);border:0;padding:9px 16px;font-weight:600}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px}
.card.c-y{background:var(--y)}.card.c-p{background:var(--p)}.card.c-g{background:var(--g)}.card.c-bl{background:var(--bl)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:14px}.grid .card{margin:0}
.stat{position:relative;overflow:hidden;min-height:130px}.stat>*{position:relative;z-index:1}
.stat::after{content:'';position:absolute;right:-16px;bottom:-16px;width:92px;height:92px;background:rgba(0,0,0,.13)}
.c-y.stat::after{clip-path:polygon(50% 0%,61% 20%,82% 10%,80% 34%,100% 43%,84% 58%,95% 80%,71% 80%,63% 100%,50% 84%,37% 100%,29% 80%,5% 80%,16% 58%,0% 43%,20% 34%,18% 10%,39% 20%)}
.c-p.stat::after{clip-path:circle(50%)}
.c-g.stat::after{clip-path:polygon(50% 0,100% 100%,0 100%)}
.c-bl.stat::after{clip-path:polygon(50% 0%,62% 25%,90% 15%,75% 40%,100% 50%,75% 60%,90% 85%,62% 75%,50% 100%,38% 75%,10% 85%,25% 60%,0% 50%,25% 40%,10% 15%,38% 25%)}
.k{font-size:13px;font-weight:600}.v{font-size:clamp(19px,5.4vw,26px);font-weight:800;letter-spacing:-.8px}
.pos{color:var(--pos)}.neg{color:var(--red)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
input,select,button{font-family:inherit}input,select{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--wh);color:var(--tx);min-width:0}
button.b{font:inherit;padding:11px 16px;border-radius:999px;background:#121212;color:#fff;border:0;cursor:pointer;font-weight:600}
button.s{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid #121212;background:transparent;color:var(--tx);cursor:pointer;white-space:nowrap;font-weight:600}
button.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1 1 120px}
label.l{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
.bar{height:10px;background:rgba(0,0,0,.09);border-radius:6px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.08);gap:8px}
.li:last-child{border:0}.sm{font-size:12px;color:var(--mut)}
.c-y .sm,.c-p .sm,.c-g .sm,.c-bl .sm{color:rgba(0,0,0,.6)}
details{border-bottom:1px solid rgba(0,0,0,.08);padding:8px 0}details:last-child{border:0}summary{cursor:pointer;font-weight:600}
.tip{background:var(--wh);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:8px}
.tip.w{background:#f7e8a4}
.bd{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--g);color:#1b2b10;margin:2px 4px 2px 0;white-space:nowrap}
.bd.w{background:var(--y);color:#4a3a00}.bd.r{background:#f3b3ad;color:#6e1510}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh b{background:var(--p);padding:4px 14px;border-radius:999px;font-size:13px}.calh b::first-letter{text-transform:uppercase}
.calh button{background:none;border:0;font-size:18px;cursor:pointer;color:var(--tx)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .w{font-size:11px;color:var(--mut);padding:3px 0}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:13px;position:relative}
.cal .d.today{background:var(--p);font-weight:800}
.cal .d.ev::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:#121212}
.tl{display:flex;align-items:center;gap:10px;background:var(--wh);border-radius:16px;padding:9px 12px;margin-bottom:8px}
.tl .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.tl .t{flex:1;min-width:0;font-size:14px;line-height:1.25}.tl.pj{opacity:.62}
@media(max-width:820px){
 body{padding:0}
 .shell{border:0;border-radius:0;padding:12px 12px 96px;display:block}
 .side{position:fixed;left:10px;right:10px;bottom:10px;top:auto;width:auto;min-height:0;padding:6px;border-radius:24px;z-index:9}
 .logo,.side .lbl{display:none}
 nav{flex-direction:row;gap:0}
 nav button{flex:1;padding:12px 2px;font-size:12.5px;justify-content:center;text-align:center;border-radius:18px}
 h1{font-size:28px}
}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="logo">meu$<i></i></div><div class="lbl">Geral</div><nav id="nav"></nav></aside>
<main>
<div class="top"><div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div><input type="month" id="mes" onchange="render()"></div>
<div id="app"></div>
</main>
</div>
<script>
/* ===== Configuração ===== */
// N = necessidades, W = desejos, F = futuro (apê, dívidas, investimentos)
const CD={Moradia:'N',Contas:'N',Alimentação:'N',Transporte:'N',Saúde:'N',Educação:'N',Apartamento:'F',Dívidas:'F',Investimentos:'F',Lazer:'W',Compras:'W',Assinaturas:'W',Outros:'W'};
const CR=['Salário','Renda extra','Outros'];
const FP=['Pix/Débito','Dinheiro','Boleto'];
const TABS=[['res','📊','Resumo'],['lan','🧾','Mês'],['car','💳','Cartões'],['ape','🏠','Apê'],['met','🎯','Metas'],['mais','➕','Mais']];

/* ===== Utilidades ===== */
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hm=()=>hoje().slice(0,7);
const addM=(k,n)=>{const[y,m]=k.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const dm=(a,b)=>{const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return(y2-y1)*12+m2-m1};
const ML=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.','').replace(' de ','/')};
const MLong=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const fmtd=iso=>iso.split('-').reverse().slice(0,2).join('/');
const dias=d=>Math.round((new Date(d+'T00:00:00')-new Date(hoje()+'T00:00:00'))/864e5);
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const sum=a=>a.reduce((s,t)=>s+(+t.v||0),0);
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const mes=()=>$('mes').value||hm();

/* ===== Dados ===== */
let S,tab='res';
function seed(){
 return{v:3,tx:[],paid:{},orc:{},met:[],inv:[],cards:[],rec:[],
  apt:{parcela:0,dia:10,total:0,pagas:0},
  meta:{alvo:0,base:0,mensal:0,prazo:'',ini:'',ap:[]},div:[]};
}
function fix(o){
 ['tx','cards','rec','div','met','inv'].forEach(k=>o[k]=Array.isArray(o[k])?o[k]:[]);
 o.orc=o.orc||{};o.paid=o.paid||{};
 o.apt=Object.assign({parcela:0,dia:10,total:0,pagas:0},o.apt);
 o.meta=Object.assign({alvo:0,base:0,mensal:0,prazo:'',ini:'',ap:[]},o.meta);o.meta.ap=o.meta.ap||[];
 o.tx.forEach(t=>{t.id=String(t.id);t.m=t.m||t.d.slice(0,7);t.cd=t.cd||'';t.fp=t.fp||'Pix/Débito'});
 return o}
function load(){
 try{localStorage.removeItem('cf1');localStorage.removeItem('cf2')}catch(e){}
 try{const r=localStorage.getItem('cf3');if(r)return fix(JSON.parse(r))}catch(e){}
 return fix(seed())}
const save=()=>{try{localStorage.setItem('cf3',JSON.stringify(S))}catch(e){}};
S=load();save();
$('mes').value=hm();

/* ===== Regras de cartão ===== */
const cardOf=id=>S.cards.find(c=>c.id==id);
const cn=id=>{const c=cardOf(id);return c?c.n:''};
// mês (AAAA-MM) em que a compra feita em "d" vence na fatura
function fm(cd,d){const c=cardOf(cd),k=d.slice(0,7);if(!c)return k;
 const day=+d.slice(8,10),F=+c.fech||0,V=+c.venc||0;if(!F||!V)return k;
 const fechaEm=day>F?addM(k,1):k;
 return V>F?fechaEm:addM(fechaEm,1)}
const isPaid=(cd,m)=>m<hm()||!!S.paid[cd+'|'+m];
const usado=c=>sum(S.tx.filter(t=>t.cd==c.id&&t.k=='d'&&!isPaid(c.id,t.m)));
const fat=(c,m)=>sum(S.tx.filter(t=>t.cd==c.id&&t.k=='d'&&t.m==m));
const vencDate=(c,m)=>c.venc?m+'-'+pad(Math.min(+c.venc,28)):'';
function refat(c){S.tx.filter(t=>t.cd==c.id).forEach(t=>{const i=t.p?parseInt(t.p)-1:0;t.m=addM(fm(c.id,t.d),i)})}
function grupos(c){const g={};S.tx.filter(t=>t.cd==c.id&&t.pid&&t.n>1).forEach(t=>(g[t.pid]=g[t.pid]||[]).push(t));return Object.values(g)}

/* ===== Apartamento, dívidas, fixas ===== */
const aptPagas=()=>(+S.apt.pagas||0)+S.tx.filter(t=>t.ap&&t.m<=hm()).length;
const aptRest=()=>S.apt.total>0?Math.max(S.apt.total-aptPagas(),0):null;
function aptFor(k){const A=S.apt;if(!(A.parcela>0))return 0;const r=aptRest();if(r!==null&&dm(hm(),k)>r)return 0;return A.parcela}
function aptDue(mm){const A=S.apt;if(!(A.parcela>0))return false;if(S.tx.some(t=>t.ap&&t.rm==mm))return false;const r=aptRest();return !(r!==null&&r<=0)}
function divFor(mm){const k=dm(hm(),mm);if(k<0)return 0;return sum(S.div.filter(x=>x.n-x.pagas>k).map(x=>({v:x.vm})))}
function pendFixas(mm){const a=S.rec.filter(r=>!S.tx.some(t=>t.rid==r.id&&t.rm==mm)).map(r=>r.ds);if(aptDue(mm))a.push('Parcela do apê');return a}
function genApt(mm){if(!aptDue(mm))return 0;const d=mm+'-'+pad(Math.min(+S.apt.dia||10,28));
 S.tx.push({id:uid(),k:'d',v:+S.apt.parcela,ds:'Parcela do apê',c:'Apartamento',d,m:mm,f:true,fp:'Boleto',cd:'',p:'',ap:1,rm:mm});return 1}
function lancarFixas(){const mm=mes();let n=0;
 S.rec.forEach(r=>{if(S.tx.some(t=>t.rid==r.id&&t.rm==mm))return;
  const d=mm+'-'+pad(Math.min(+r.dia||1,28));
  S.tx.push({id:uid(),k:r.k,v:+r.v,ds:r.ds,c:r.c,d,m:r.cd?fm(r.cd,d):mm,f:true,fp:r.cd?'Cartão':r.fp,cd:r.cd||'',p:'',rid:r.id,rm:mm});n++});
 n+=genApt(mm);save();render()}

/* ===== Navegação ===== */
function go(t){tab=t;render();window.scrollTo(0,0)}
function ttl(){const mm=mes(),h=new Date().getHours();
 if(tab=='res'){const fs=S.cards.filter(c=>fat(c,mm)>0&&!isPaid(c.id,mm)),tot=sum(fs.map(c=>({v:fat(c,mm)})));
  return[(h<12?'Bom dia':h<18?'Boa tarde':'Boa noite')+'',fs.length?`Você tem ${fs.length} fatura(s) em aberto em ${ML(mm)}, somando ${R(tot)}.`:`Nenhuma fatura em aberto em ${ML(mm)}. Respira! 🌿`]}
 return({lan:['Lançamentos','Tudo o que entra e sai em '+ML(mm)],car:['Meus cartões','Limites, faturas e compras parceladas'],ape:['Meu apê','Parcelas do contrato, reforços e extras'],met:['Metas e dívidas','Reserva, dívidas, objetivos e limites por categoria'],mais:['Mais','Investimentos, aprendizado e backup']})[tab]}
function render(){
 $('nav').innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[2]}</span></button>`).join('');
 const T=ttl();$('ttl').textContent=T[0];$('sub').textContent=T[1];
 $('app').innerHTML=({res:vRes,lan:vLan,car:vCar,ape:vApe,met:vMet,mais:vMais})[tab]();
 if(tab=='lan'){cats('l');cats('r')}
 if(tab=='car')cats('q');
}
const mt=()=>S.tx.filter(t=>t.m==mes());

/* ===== Resumo ===== */
function shiftMes(n){$('mes').value=addM(mes(),n);render()}
function calBox(mm){
 const[y,m]=mm.split('-').map(Number),first=new Date(y,m-1,1).getDay(),nd=new Date(y,m,0).getDate(),td=hoje(),evs=[];
 S.tx.filter(t=>t.m==mm&&!t.cd&&(t.f||t.ap||t.ex||t.k=='r')).forEach(t=>evs.push({d:+t.d.slice(8,10),l:t.ds,v:t.v,k:t.k,c:t.ap||t.ex?'bl':t.k=='r'?'g':'y'}));
 S.rec.filter(r=>!S.tx.some(t=>t.rid==r.id&&t.rm==mm)).forEach(r=>evs.push({d:Math.min(+r.dia||1,nd),l:r.ds,v:r.v,k:r.k,c:r.k=='r'?'g':'y',pj:1}));
 if(aptDue(mm))evs.push({d:Math.min(+S.apt.dia||10,nd),l:'Parcela do apê',v:S.apt.parcela,k:'d',c:'bl',pj:1});
 S.cards.forEach(c=>{const v=fat(c,mm);if(v&&c.venc)evs.push({d:Math.min(+c.venc,nd),l:'Fatura '+c.n,v,k:'d',c:'p',paid:isPaid(c.id,mm)})});
 evs.sort((a,b)=>a.d-b.d);const dd=new Set(evs.map(e=>e.d));
 let g=['D','S','T','Q','Q','S','S'].map(x=>`<div class="w">${x}</div>`).join('')+'<div></div>'.repeat(first);
 for(let d=1;d<=nd;d++)g+=`<div class="d${td==mm+'-'+pad(d)?' today':''}${dd.has(d)?' ev':''}">${d}</div>`;
 return`<div class="card"><div class="calh"><button onclick="shiftMes(-1)">‹</button><b>${MLong(mm).replace(' de ',' ')}</b><button onclick="shiftMes(1)">›</button></div><div class="cal">${g}</div></div>
 <div class="card"><h2>Linha do tempo</h2>${evs.map(e=>`<div class="tl${e.pj?' pj':''}"><div class="dot" style="background:var(--${e.c})">${e.d}</div><div class="t">${esc(e.l)}${e.pj?'<div class="sm">previsto</div>':''}</div><div style="text-align:right"><b class="${e.k=='r'?'pos':'neg'}">${e.k=='r'?'+':'−'}${R(e.v)}</b>${e.paid?'<div><span class="bd">paga</span></div>':''}</div></div>`).join('')||'<div class="sm">Nada previsto neste mês.</div>'}</div>`}
function vRes(){
 const mm=mes(),m=mt(),rec=sum(m.filter(t=>t.k=='r')),ds=m.filter(t=>t.k=='d'),dv=divFor(mm),des=sum(ds)+dv,sal=rec-des,tx=pct(sal,rec);
 const g=c=>sum(ds.filter(t=>CD[t.c]==c))+(c=='F'?dv:0);
 const p=[['Necessidades',g('N'),50],['Desejos',g('W'),30],['Futuro (reserva, apê, dívidas, investimentos)',g('F'),20]];
 const by={};ds.forEach(t=>by[t.c]=(by[t.c]||0)+t.v);if(dv)by['Dívidas pessoais']=dv;
 const top=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 const gu=S.meta.base+sum(S.meta.ap);
 let msg=rec==0?'Registre sua renda do mês (aba Mês) para ver a análise.':tx>=20?'Excelente: você está poupando 20% ou mais da renda.':tx>=10?'Bom caminho. Tente chegar a 20% cortando desejos.':tx>=0?'Margem apertada: revise gastos variáveis e assinaturas.':'Atenção: você gastou mais do que ganhou neste mês.';
 const al=[];const pf=pendFixas(mm);
 if(pf.length)al.push(`📌 ${pf.length} conta(s) fixa(s) ainda não lançada(s) em ${ML(mm)}: ${esc(pf.join(', '))}. <button class="s" onclick="lancarFixas()">Lançar agora</button>`);
 S.cards.forEach(c=>{if(c.lim&&pct(usado(c),c.lim)>=80)al.push(`💳 ${esc(c.n)} está com ${pct(usado(c),c.lim)}% do limite em uso.`)});
 const fcs=S.cards.map(c=>{const v=fat(c,mm);if(!v)return'';
  const pg=isPaid(c.id,mm),vd=vencDate(c,mm),di=vd?dias(vd):null;
  const st=pg?'<span class="bd">paga</span>':di==null?'':di<0?`<span class="bd r">venceu há ${-di}d</span>`:di<=5?`<span class="bd w">vence ${di==0?'hoje':'em '+di+'d'}</span>`:'';
  return`<div class="li"><div>💳 ${esc(c.n)}<div class="sm">${vd?'vence '+fmtd(vd):'defina o vencimento em Cartões'}</div></div><div style="text-align:right"><b>${R(v)}</b><div>${st}${mm>=hm()?`<button class="s" onclick="togPaid('${c.id}','${mm}')">${pg?'desfazer':'paguei'}</button>`:''}</div></div></div>`}).join('');
 const fut=[1,2,3,4,5,6].map(i=>{const k=addM(mm,i);return[k,sum(S.tx.filter(t=>t.k=='d'&&t.cd&&t.p&&t.m==k)),aptFor(k),divFor(k)]});
 const fmx=Math.max(1,...fut.map(x=>x[1]+x[2]+x[3]));
 const temFut=fut.some(x=>x[1]+x[2]+x[3]>0);
 return`<div class="grid"><div class="card c-y stat"><div class="k">Renda do mês</div><div class="v">${R(rec)}</div></div>
 <div class="card c-p stat"><div class="k">Total de gastos</div><div class="v">${R(des)}</div></div>
 <div class="card c-g stat"><div class="k">Saldo do mês</div><div class="v">${R(sal)}</div><div class="sm">${rec?'poupança de '+tx+'%':''}</div></div>
 <div class="card c-bl stat"><div class="k">Guardado p/ reserva</div><div class="v">${R(gu)}</div><div class="sm">${pct(gu,S.meta.alvo)}% da meta</div></div></div>
 <div class="cols"><div>
 <div class="card"><div class="tip" style="margin:0">${msg}</div>${al.map(a=>`<div class="tip w">${a}</div>`).join('')}</div>
 <div class="card c-p"><h2>💳 Faturas que vencem em ${ML(mm)}</h2>${fcs||'<div class="sm">Nenhuma fatura neste mês.</div>'}</div>
 ${temFut?`<div class="card c-bl"><h2>🔒 Já comprometido nos próximos meses</h2><div class="sm" style="margin-bottom:6px">Parcelas no cartão + parcela do apê + dívidas pessoais.</div>${fut.map(x=>{const t=x[1]+x[2]+x[3];return`<div class="sm">${ML(x[0])} · <b>${R(t)}</b>${x[1]?' · cartões '+R(x[1]):''}${x[2]?' · apê '+R(x[2]):''}${x[3]?' · dívidas '+R(x[3]):''}</div><div class="bar"><i style="width:${pct(t,fmx)}%"></i></div>`}).join('')}</div>`:''}
 <div class="card"><h2>Regra 50/30/20</h2>${p.map(x=>{const q=pct(x[1],rec),bad=x[2]==20?(rec>0&&q<x[2]):q>x[2];return`<div class="sm">${x[0]}: ${q}% da renda (ideal ${x[2]}%) · ${R(x[1])}</div><div class="bar"><i style="width:${Math.min(q,100)}%;background:${bad?'var(--yel)':'var(--ac)'}"></i></div>`}).join('')}</div>
 <div class="card c-y"><h2>Para onde foi o dinheiro</h2>${top.length?top.map(([c,v])=>`<div class="sm">${esc(c)} · ${R(v)} (${pct(v,des)}%)</div><div class="bar"><i style="width:${pct(v,des)}%"></i></div>`).join(''):'<div class="sm">Nenhuma despesa neste mês.</div>'}
 <div class="sm" style="margin-top:8px">Fixas: ${R(sum(ds.filter(t=>t.f)))} · Variáveis: ${R(sum(ds.filter(t=>!t.f)))}</div></div>
 ${vHist()}
 </div><div>${calBox(mm)}</div></div>`;
}
function togPaid(cd,m){const k=cd+'|'+m;S.paid[k]=!S.paid[k];save();render()}
function vHist(){const[y,m]=mes().split('-').map(Number),a=[];
 for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1),k=d.getFullYear()+'-'+pad(d.getMonth()+1),t=S.tx.filter(x=>x.m==k);a.push([d.toLocaleDateString('pt-BR',{month:'short'}),sum(t.filter(x=>x.k=='r')),sum(t.filter(x=>x.k=='d'))])}

function addTx(p){const v=parseFloat($(p+'v').value);if(!(v>0)){$(p+'v').focus();return}
 const k=$(p+'k')?$(p+'k').value:'d',fp=$(p+'fp').value,cd=k=='d'&&fp.startsWith('c:')?fp.slice(2):'';
 if(!fp){alert('Cadastre um cartão primeiro (aba Cartões).');return}

 for(let i=0;i<n;i++){const vi=i==n-1?Math.round((v-pv*(n-1))*100)/100:pv;

 if(cd&&first!=mes()&&p=='l')$('mes').value=first;
 save();render()}

function vCar(){
 return`<div class="card"><h2>Nova compra no cartão</h2>${S.cards.length?txForm('q',false):'<div class="sm">Cadastre um cartão abaixo.</div>'}

function cardBox(c){
 const u=usado(c),l=+c.lim||0,q=pct(u,l),mm=mes(),fv=fat(c,mm),pg=isPaid(c.id,mm),vd=vencDate(c,mm),gs=grupos(c),itens=S.tx.filter(t=>t.cd==c.id&&t.m==mm).sort((a,b)=>a.d.localeCompare(b.d));
 const prox=[0,1,2,3,4,5,6,7].map(i=>{const k=addM(hm(),i),v=fat(c,k);return v?`<span class="bd">${ML(k)} · ${R(v)}</span>`:''}).join('');
 return`<div class="card"><div class="li" style="border:0;padding:0"><h2 style="margin:0">💳 ${esc(c.n)}</h2><button class="x" onclick="delCard('${c.id}')">✕</button></div>
 <div class="row" style="margin-top:8px"><div><label class="l">Limite (R$)</label><input type="number" min="0" value="${l||''}" onchange="setCard('${c.id}','lim',this.value)"></div><div><label class="l">Fecha no dia</label><input type="number" min="1" max="31" value="${c.fech||''}" onchange="setCard('${c.id}','fech',this.value)"></div><div><label class="l">Vence no dia</label><input type="number" min="1" max="31" value="${c.venc||''}" onchange="setCard('${c.id}','venc',this.value)"></div></div>
 ${!c.fech?'<div class="tip w" style="margin:0 0 8px">⚠️ Informe o dia de fechamento para as compras caírem na fatura certa.</div>':''}
 ${l?`<div class="bar"><i style="width:${Math.min(q,100)}%;background:${q>=100?'var(--red)':q>=80?'var(--yel)':'var(--ac)'}"></i></div><div class="sm">Em aberto ${R(u)} de ${R(l)} (${q}%) · limite disponível <b>${R(l-u)}</b></div>`:`<div class="sm">Em aberto: ${R(u)} · informe o limite para ver o disponível.</div>`}
 <div class="li" style="margin-top:6px"><div>Fatura de ${ML(mm)}<div class="sm">${vd?'vence '+fmtd(vd):'sem vencimento'}</div></div><div style="text-align:right"><b>${R(fv)}</b><div>${fv&&pg?'<span class="bd">paga</span>':''}${fv&&mm>=hm()?`<button class="s" onclick="togPaid('${c.id}','${mm}')">${pg?'desfazer':'paguei'}</button>`:''}</div></div></div>
 ${prox?`<div style="margin-top:4px"><div class="sm">Próximas faturas</div>${prox}</div>`:''}
 <details><summary>Itens da fatura de ${ML(mm)} (${itens.length})</summary>${itens.map(li).join('')||'<div class="sm">Nada nesta fatura.</div>'}</details>
 <details><summary>Compras parceladas (${gs.length})</summary>${gs.map(g=>parcBox(c,g)).join('')||'<div class="sm">Nenhuma compra parcelada.</div>'}</details></div>`}
function parcBox(c,g){g.sort((a,b)=>a.m.localeCompare(b.m));const f=g[0],pagas=g.filter(t=>isPaid(c.id,t.m)).length,falta=sum(g.filter(t=>!isPaid(c.id,t.m))),nx=g.find(t=>!isPaid(c.id,t.m));
 return`<div class="li" style="align-items:flex-start"><div style="flex:1"><b>${esc(f.ds)}</b><div class="sm">compra ${fmtd(f.d)}/${f.d.slice(2,4)} · total ${R(f.tot||sum(g))} · ${f.n}× ${R(f.v)}</div><div class="bar"><i style="width:${pct(pagas,f.n)}%"></i></div><div class="sm">${pagas}/${f.n} pagas · ${nx?'restam '+(f.n-pagas)+' · falta '+R(falta)+' · próx. '+ML(nx.m):'quitada ✓'}</div></div><button class="x" title="Excluir compra inteira" onclick="delCompra('${f.pid}')">✕</button></div>`}

function metaBox(){

 const nec=mr>0?falta/mr:0,nm=M.mensal>0?Math.ceil(falta/M.mensal):0;
 const rows=[];if(M.ini||M.ap.length){const ini=M.ini||M.ap.map(a=>a.m).sort()[0];let ac=M.base;for(let k=ini;k<=hm()&&rows.length<60;k=addM(k,1)){const gm=sum(M.ap.filter(a=>a.m==k));ac+=gm;rows.push([k,gm,ac,gm==0?'pendente':!M.mensal?'guardado':gm>=M.mensal?'meta batida':'abaixo da meta'])}}
 return`<div class="card c-g"><h2>🛟 Reserva de emergência</h2>
 <div class="sm" style="margin-bottom:6px">Sugestão: 3 a 6× seus gastos essenciais do mês (${R(es*3)} a ${R(es*6)}).</div><div class="bar"><i style="width:${Math.min(q,100)}%"></i></div><div class="sm">${R(gu)} de ${R(M.alvo)} (${q}%) · falta <b>${R(falta)}</b></div>

 <div class="row" style="margin-top:10px"><div><label class="l">Valor da reserva (meta)</label><input type="number" min="0" value="${M.alvo||''}" onchange="setMeta('alvo',this.value)"></div><div><label class="l">Já guardado</label><input type="number" min="0" value="${M.base||''}" onchange="setMeta('base',this.value)"></div></div>

}

 <div class="row"><input id="dt2" type="number" min="0" step="0.01" placeholder="Valor total"><input id="dn" type="number" min="1" placeholder="Nº parcelas"><input id="dv" type="number" min="0" step="0.01" placeholder="Valor/mês (auto)"></div>
 <button class="b" style="width:100%" onclick="addDiv()">Adicionar dívida</button></div>
 <div class="card"><h2>Nova meta (outros objetivos)</h2><div class="row"><input id="mn" placeholder="Nome (ex.: Reserva, Viagem)"><input id="mv" type="number" min="0" placeholder="Valor alvo"></div><button class="b" style="width:100%" onclick="addMet()">Criar meta</button>
 <div class="tip">Reserva de emergência sugerida: de 3 a 6× seus gastos essenciais do mês (${R(des*3)} a ${R(des*6)}).</div></div>
 ${S.met.map((m,i)=>{const q=pct(m.s,m.t);return`<div class="card"><div class="li" style="border:0;padding:0"><b>${esc(m.n)}</b><button class="x" onclick="delMet(${i})">✕</button></div>
 <div class="bar"><i style="width:${Math.min(q,100)}%"></i></div><div class="sm">${R(m.s)} de ${R(m.t)} (${q}%) · faltam ${R(Math.max(m.t-m.s,0))}</div>
 <div class="row" style="margin-top:8px"><input id="ap${i}" type="number" min="0" placeholder="Valor a guardar"><button class="b" onclick="aporte(${i})">Guardar</button></div></div>`}).join('')}
 <div class="card"><h2>Limites por categoria · ${ML(mes())}</h2><div class="sm" style="margin-bottom:8px">Quanto pode gastar por mês em cada categoria.</div>${Object.keys(CD).map(c=>{const g=sum(ds.filter(t=>t.c==c)),l=S.orc[c]||0,q=pct(g,l);
 return`<div style="margin-bottom:12px"><div class="li" style="border:0;padding:0"><b>${c}</b><input type="number" min="0" style="width:110px" placeholder="Limite" value="${l||''}" onchange="setOrc('${c}',this.value)"></div>
 <div class="bar"><i style="width:${Math.min(q,100)}%;background:${q>=100?'var(--red)':q>=80?'var(--yel)':'var(--ac)'}"></i></div>
 <div class="sm">${R(g)} gastos${l?` de ${R(l)} (${q}%) · ${g>l?'estourou '+R(g-l):'resta '+R(l-g)}`:''}</div></div>`}).join('')}</div>`;
}
function addDiv(){const t=parseFloat($('dt2').value),n=parseInt($('dn').value)||1;if(!(t>0)||!$('dd').value.trim()){$('dd').focus();return}
 S.div.push({id:uid(),ds:$('dd').value.trim(),cred:$('dc').value.trim(),tot:t,n,pagas:0,vm:parseFloat($('dv').value)||Math.round(t/n*100)/100});save();render()}
function payDiv(id){const x=S.div.find(d=>d.id==id);if(x&&x.pagas<x.n){x.pagas++;save();render()}}
function delDiv(id){if(!confirm('Excluir esta dívida?'))return;S.div=S.div.filter(d=>d.id!=id);save();render()}
function setOrc(c,v){S.orc[c]=parseFloat(v)||0;save();render()}
function addMet(){const t=parseFloat($('mv').value);if(!(t>0))return;S.met.push({n:$('mn').value.trim()||'Meta',t,s:0});save();render()}
function aporte(i){const v=parseFloat($('ap'+i).value);if(!(v>0))return;S.met[i].s+=v;save();render()}
function delMet(i){S.met.splice(i,1);save();render()}

/* ===== Mais (investimentos, aprender, backup) ===== */
const TI=['Renda fixa','Ações','FIIs','Cripto','Exterior','Outros'];
function vMais(){
 const tot=sum(S.inv),by={};S.inv.forEach(i=>by[i.t]=(by[i.t]||0)+i.v);
 return`<div class="card"><h2>Novo investimento</h2><div class="row"><input id="in" placeholder="Nome (ex.: Tesouro Selic)"><select id="it">${TI.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="row"><input id="iv" type="number" min="0" placeholder="Valor atual (R$)"><button class="b" onclick="addInv()">Adicionar</button></div></div>
 <div class="card"><h2>Patrimônio investido: ${R(tot)}</h2>${Object.entries(by).map(([t,v])=>`<div class="sm">${t} · ${R(v)} (${pct(v,tot)}%)</div><div class="bar"><i style="width:${pct(v,tot)}%"></i></div>`).join('')||'<div class="sm">Nada cadastrado.</div>'}<div class="tip">Mantenha a reserva de emergência em renda fixa com liquidez antes de assumir riscos, e diversifique entre tipos de ativos. Atualize os valores de vez em quando para acompanhar a evolução.</div></div>
 <div class="card">${S.inv.map((i,k)=>`<div class="li"><div>${esc(i.n)}<div class="sm">${i.t}</div></div><div><input type="number" style="width:110px" value="${i.v}" onchange="updInv(${k},this.value)"> <button class="x" onclick="delInv(${k})">✕</button></div></div>`).join('')||'<div class="sm">Sem ativos ainda.</div>'}</div>
 ${vEdu()}
 <div class="card"><h2>💾 Backup dos dados</h2><div class="sm" style="margin-bottom:8px">Seus dados ficam só neste aparelho/navegador. Exporte de vez em quando para não perder.</div>
 <div class="row"><button class="b" onclick="exp()">Exportar backup</button><label class="b" style="text-align:center;cursor:pointer;padding:9px;border-radius:9px">Importar backup<input type="file" accept=".json,application/json" style="display:none" onchange="imp(this)"></label></div>
 <button class="s" style="margin-top:6px" onclick="resetAll()">Apagar tudo e recomeçar</button></div>`;
}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='controle-financeiro-backup-'+hoje()+'.json';a.click()}
function imp(inp){const f=inp.files[0];if(!f)return;if(!confirm('Importar substitui todos os dados atuais. Continuar?')){inp.value='';return}
 const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.tx))throw 0;S=fix(o);save();render()}catch(e){alert('Arquivo inválido.')}};r.readAsText(f)}
function resetAll(){if(!confirm('Apagar TODOS os dados deste aparelho e voltar ao modelo inicial?'))return;S=fix(seed());save();render()}
function addInv(){const v=parseFloat($('iv').value);if(!(v>=0)||!$('iv').value)return;S.inv.push({n:$('in').value.trim()||$('it').value,t:$('it').value,v});save();render()}
function updInv(k,v){S.inv[k].v=parseFloat(v)||0;save();render()}
function delInv(k){S.inv.splice(k,1);save();render()}
function vEdu(){
 return`<div class="card"><h2>🎓 Educação financeira</h2>
 <details><summary>1. Pague-se primeiro</summary><p>Separe a parte do futuro (apê, investir, quitar dívidas) assim que a renda entrar, e gaste o que sobrar. Poupar o que sobra raramente funciona.</p></details>
 <details><summary>2. Regra 50/30/20</summary><p>50% da renda para necessidades, 30% para desejos e 20% para o futuro. É um ponto de partida: ajuste à sua realidade, mas use como bússola. Aqui, a parcela do apê conta como "futuro".</p></details>
 <details><summary>3. Fechamento × vencimento do cartão</summary><p>A fatura fecha num dia (compras depois dele vão para a fatura seguinte) e vence alguns dias depois. Comprar logo após o fechamento dá mais prazo para pagar. Por isso o app pede os dois dias de cada cartão.</p></details>
 <details><summary>4. Parcelado também é dívida</summary><p>Cada parcela já tem dono nos meses seguintes e reduz o limite disponível. Antes de parcelar, olhe quanto já está comprometido na aba Resumo.</p></details>
 <details><summary>5. Vários cartões</summary><p>Acompanhar o limite e o vencimento de cada um evita atraso e rotativo. Se possível, concentre as compras em poucos cartões e quite primeiro o que tem juros mais altos.</p></details>
 <details><summary>6. Reserva de emergência</summary><p>Guarde 3 a 6 meses de gastos essenciais em algo seguro e com liquidez diária (ex.: Tesouro Selic ou CDB de liquidez diária). Ela evita que um imprevisto vire dívida.</p></details>
 <details><summary>7. Cuidado com dívidas caras</summary><p>Rotativo do cartão e cheque especial têm juros altíssimos. Quitar essas dívidas rende mais do que quase qualquer investimento. Priorize-as antes de investir.</p></details>
 <details><summary>8. Juros compostos</summary><p>O tempo é o maior aliado: quanto antes começar, menor o esforço mensal. Simule abaixo.</p></details></div>
 <div class="card"><h2>Simulador de juros compostos</h2>
 <div class="row"><input id="sa" type="number" placeholder="Aporte mensal" value="300"><input id="st" type="number" placeholder="Taxa anual %" value="10"><input id="sy" type="number" placeholder="Anos" value="10"></div>
 <button class="b" style="width:100%" onclick="sim()">Simular</button><div id="so" class="tip"></div></div>`;
}
function sim(){const a=+$('sa').value,t=+$('st').value/100,y=+$('sy').value,i=Math.pow(1+t,1/12)-1;let s=0;for(let n=0;n<y*12;n++)s=s*(1+i)+a;const inv=a*y*12;
 $('so').innerHTML=`Você investiria <b>${R(inv)}</b> e teria cerca de <b>${R(s)}</b>. Os juros renderiam <b>${R(s-inv)}</b>. (Simulação simples, sem impostos ou inflação.)`}
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
